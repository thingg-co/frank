[project]
name = "frank-local"
version = "0.4.0"
description = "A terminal coding agent with tool calling, for a local OpenAI-compatible model server (llama.cpp on a DGX Spark)."
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "thingg.co" }]
dependencies = [
    "openai>=1.60,<3",
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0.48",
]

[project.scripts]
frank = "frank_local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frank_local"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
